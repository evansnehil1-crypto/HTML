<html>
<p id="i1"></p>
<p id="i2"></p>

<body>
<script>
class student {
    constructor(name, year) {
        this.name = name;
        this.year = year;
    }

    age() {
        let d = new Date(); // current date
        return d.getFullYear() - this.year; // 2026 - 2013
    }
}

s1 = new student("Hammad", 2013); // creating object -> constructor will be called automatically
document.getElementById("i1").innerHTML = "My name is " + s1.name + ", I born in " + s1.year + ". And my age is " + s1.age();

s1 = new student("Umair", 2009);
document.getElementById("i2").innerHTML = "My name is" + s1.name + ",I waas born in" + s1.year + "And my age is " + s1.age();
</script>
</body>
</html>
