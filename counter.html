<!DOCTYPE html>
<html>
<head>
    <title>Counter</title>
</head>
<body>
    <div class="wrapper">
        <h1>Counter</h1>
        <p id="count">0</p>
        <button id="button-plus">+</button>
        <button id="button-minus">-</button>
    </div>

    <script>
        var count = 0;
        var display = document.getElementById("count");
        var buttonPlus = document.getElementById("button-plus");
        var buttonMinus = document.getElementById("button-minus");

        buttonPlus.onclick = function() {
            count++;
            display.innerHTML = count;
        }

        buttonMinus.onclick = function() {
            count--;
            display.innerHTML = count;
        }
    </script>
</body>
</html>
