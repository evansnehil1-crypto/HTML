<!DOCTYPE html>
<html>
<head>
<title>Bootstrap Example</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

</head>

<body>
  <div class="container">
    <h2>Pagination</h2>
    <p>Fall in love with coding</p>

    <ul class="pagination">

      <li class="page-item">
        <a class="page-link" href="https://www.google.com">Previous</a>
      </li>

      <li class="page-item">
        <a class="page-link" href="https://www.google.com">1</a>
      </li>

      <li class="page-item">
        <a class="page-link" href="https://www.youtube.com">2</a>
      </li>

      <li class="page-item">
        <a class="page-link" href="https://www.wikipedia.org">3</a>
      </li>

      <li class="page-item">
        <a class="page-link" href="https://www.github.com">4</a>
      </li>

      <li class="page-item">
        <a class="page-link" href="https://www.stackoverflow.com">5</a>
      </li>

      <li class="page-item">
        <a class="page-link" href="https://www.bing.com">Next</a>
      </li>

    </ul>
  </div>
</body>
</html>
