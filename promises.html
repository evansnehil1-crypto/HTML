<!DOCTYPE html>
<html>
<body>

<h2>JavaScript Promise</h2>

<p id="demo"></p>

<script>
function myDisplayer(some) {
    document.getElementById("demo").innerHTML = some;
}

function sum(a, b) {
    var sum = a + b;
    myDisplayer(sum);
}

let myPromise = new Promise(function(myResolve, myReject) {
    let x = 0; // try changing this to 5

    if (x == 0) {
        myResolve("OK"); // success
    } else {
        myReject("Error"); // error
    }
});

// consuming the promise
myPromise.then(
    function(value) { sum(5, 5); },   // if success
    function(error) { sum(error, 5); } // if error
);
</script>

</body>
</html>
